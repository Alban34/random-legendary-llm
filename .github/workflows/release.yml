name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'

# Required for OIDC-based GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint-and-test:
    name: Lint, Unit tests & E2E
    runs-on: ubuntu-latest
    # Safety net: never let the whole job hang for the 6h default limit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Resolve Playwright version
        id: playwright-version
        # Reads the exact version installed by `npm ci` so the cache key tracks browser compatibility
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright system dependencies
        # DEBIAN_FRONTEND prevents apt from blocking on interactive prompts (tzdata, needrestart, …)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx --no-install playwright install-deps chromium

      - name: Install Playwright browser
        # Skip the download entirely when the browser binary was restored from cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # Use the locally installed binary (no npx network prompt) and fail fast if the download stalls
        timeout-minutes: 10
        run: npx --no-install playwright install chromium

      - name: E2E tests
        run: npm run test:qc

      - name: Upload Playwright report
        # Keep traces & screenshots only when E2E tests fail, to debug the run
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  docker-build-and-deploy:
    name: Docker build & GitOps prod deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint-and-test
    permissions:
      contents: write    # required to git push on the gitops branch
      packages: write    # required to push the image to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        # Required so the build can use the GitHub Actions layer cache
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Tagged with the git tag version number (e.g. v2.1.3)
          tags: ghcr.io/alban34/random-legendary-llm:${{ github.ref_name }}
          # Reuse Docker layers across runs via the GitHub Actions cache backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update deployment manifest on gitops branch (prod overlay)
        run: |
          git fetch origin gitops
          git checkout gitops
          sed -i "s|newTag: .*|newTag: ${{ github.ref_name }}|" deploy/overlays/prod/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/prod/kustomization.yaml
          git commit -m "release: deploy ${{ github.ref_name }} to prod"
          git push origin gitops
