name: Deploy

on:
  push:
    tags:
      - 'v*.*.*'

# Required for OIDC-based GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint-and-test:
    name: Lint, Unit tests & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:qc

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  docker-build-and-deploy:
    name: Docker build & GitOps prod deploy
    runs-on: ubuntu-latest
    needs: lint-and-test
    permissions:
      contents: write    # required to git push on the gitops branch
      packages: write    # required to push the image to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tagged with the git tag version number (e.g. v2.1.3)
          tags: ghcr.io/alban34/random-legendary-llm:${{ github.ref_name }}

      - name: Update deployment manifest on gitops branch (prod overlay)
        run: |
          git fetch origin gitops
          git checkout gitops
          sed -i "s|image: .*random-legendary-llm:.*|image: ghcr.io/alban34/random-legendary-llm:${{ github.ref_name }}|" deploy/overlays/prod/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/prod/kustomization.yaml
          git commit -m "release: deploy ${{ github.ref_name }} to prod"
          git push origin gitops
