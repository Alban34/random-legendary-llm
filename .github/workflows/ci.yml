name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default token; jobs that need more elevate explicitly
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, Unit tests & E2E
    runs-on: ubuntu-latest
    # Safety net: never let the whole job hang for the 6h default limit
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Resolve Playwright version
        id: playwright-version
        # Reads the exact version installed by `npm ci` so the cache key tracks browser compatibility
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright system dependencies
        # DEBIAN_FRONTEND prevents apt from blocking on interactive prompts (tzdata, needrestart, …)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx --no-install playwright install-deps chromium

      - name: Install Playwright browser
        # Skip the download entirely when the browser binary was restored from cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        # Use the locally installed binary (no npx network prompt) and fail fast if the download stalls
        timeout-minutes: 10
        run: npx --no-install playwright install chromium

      - name: E2E tests
        run: npm run test:qc

      - name: Upload Playwright report
        # Keep traces & screenshots only when E2E tests fail, to debug the run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        # Non-blocking: surfaces vulnerabilities without failing CI on unfixable transitive deps
        continue-on-error: true
        run: npm audit --audit-level=high

  code-analysis:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history required for accurate blame and new-code detection
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate unit test coverage (LCOV)
        run: npm run test:coverage

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  bundle-size:
    name: Bundle size check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only run on pull requests
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: du -sh dist/ >> $GITHUB_STEP_SUMMARY

      - name: Enforce 2 MB limit
        run: |
          SIZE_KB=$(du -sk dist/ | cut -f1)
          echo "Bundle size: ${SIZE_KB} KB"
          if [ "$SIZE_KB" -gt 2048 ]; then
            echo "❌ Bundle exceeds 2 MB limit (${SIZE_KB} KB)"
            exit 1
          fi
          echo "✓ Bundle size OK (${SIZE_KB} KB)"

  docker-build-and-deploy:
    name: Docker build & GitOps deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only runs on push (not on PR) and only if tests pass
    if: github.event_name == 'push'
    needs: lint-and-test
    permissions:
      contents: write    # required to git push on the gitops branch
      packages: write    # required to push the image to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        # Required so the build can use the GitHub Actions layer cache
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tagged with "dev-" prefix to distinguish from release images
          tags: ghcr.io/alban34/random-legendary-llm:dev-${{ github.sha }}
          # Reuse Docker layers across runs via the GitHub Actions cache backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update dev overlay on gitops branch
        run: |
          git fetch origin gitops
          git checkout gitops
          sed -i "s|newTag: .*|newTag: dev-${{ github.sha }}|" deploy/overlays/dev/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/dev/kustomization.yaml
          git commit -m "ci: update dev image to dev-${{ github.sha }}"
          git push origin gitops
