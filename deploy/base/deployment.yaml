apiVersion: apps/v1
kind: Deployment
metadata:
  name: random-legendary-llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: random-legendary-llm
  template:
    metadata:
      labels:
        app: random-legendary-llm
    spec:
      containers:
        - name: random-legendary-llm
          image: ghcr.io/alban34/random-legendary-llm:dev-520df6001720d9fef20970c121a5c92b71cf2ea2
          imagePullPolicy: Always
          ports:
            - containerPort: 80
